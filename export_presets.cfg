[preset.0]
name="Windows Demo"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/vfx/generated/*.json,assets/art_v3/**/*.json,assets/private_graveshade/*.json,assets/private_graveshade/audio/*.json,assets/private_viridian/*.json,assets/private_viridian/audio/*.json"
exclude_filter="art_source/*,reports/*,assets/Endless_Survival_Wizard_of_Legend_Visual_Spec_v3/*,docs/*,tests/*,tools/*,builds/*,screenshots/*,assets/sprites/*,assets/vfx/Endless_Survival_Art_Agent_Handoff_v1/*,content/characters/vex_visual_frames.tres,content/characters/boros_visual_frames.tres,*.md,*.docx"
export_path="builds/windows/EndlessSurvival.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

